<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Itinerary Event Info</title>

  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/eventInfo.css" />
</head>

<body id="itinerary-event-page">

  <main class="container">
    <div class="event">
      <div id="event-info">
        <h1 id="event-title">Loading...</h1>

        <div class="event-photo">
          <img id="event-img" style="width:100%;height:100%;object-fit:cover;" />
        </div>

        <p><strong>Date:</strong> <span id="event-date"></span></p>
        <p><strong>Time:</strong> <span id="event-time"></span></p>
        <p><strong>Duration:</strong> <span id="event-duration"></span> hrs</p>
        <p><strong>Location:</strong> <span id="event-location"></span></p>
        <p><strong>Price:</strong> $<span id="event-price"></span></p>

        <div id="event-description"></div>
      </div>

      <div class="event-options">
        <button class="btn btn-secondary" id="it-edit-btn">Edit</button>
        <button class="btn btn-secondary" id="it-remove-btn">Remove</button>
        <button class="btn btn-secondary" id="it-share-btn">Share</button>
      </div>
    </div>
  </main>

  <script src="../assets/js/popupEventInfoItinerary.js"></script>
  <script src="../assets/js/popupBookingRequestItinerary.js"></script>
</body>
</html>
