<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
	<title>Saved Events - Prototype</title>
	<link rel="stylesheet" href="../assets/css/variables.css">
	<link rel="stylesheet" href="../assets/css/main.css">
	<style>
		/* Reusing Search header styles */
		.search-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: var(--spacing-sm) var(--spacing-md);
			background: var(--color-primary);
			color: #fff;
			gap: 0.5rem;
			/* Allow wrapping so Search can go to top */
			flex-wrap: wrap; 
		}

		.search-bar {
			display: flex;
			align-items: center;
			background: #fff;
			border-radius: 1.5rem;
			padding: 0.4rem 0.8rem;
			
			/* FORCE TOP ROW */
			order: -1; 
			width: 100%;       
			flex-basis: 100%;  
			margin-bottom: 0.2rem; 
		}

		.search-bar input {
			border: none;
			flex: 1;
			font-size: 1rem;
			outline: none;
			background: transparent;
		}
		
		/* --- ROW 2 CONTROLS --- */
		
		/* 1. Buttons: Don't grow, don't shrink, fit to text */
		.search-header .btn {
			flex: 0 0 auto; 
			padding: 0.4rem 0.8rem;
			white-space: nowrap;
		}

		/* 2. Sort: Fill the space BETWEEN the buttons */
		.sort-select {
			background: #fff;
			color: #333;
			border: 1px solid transparent;
			padding: 0.4rem 0.2rem;
			border-radius: var(--radius);
			font-size: 0.9rem;
			cursor: pointer;
			text-align: center;
			
			/* This makes it fill remaining width but stay on the same line */
			flex: 1; 
			min-width: 0; /* Prevents it from forcing a wrap if text is long */
		}

		/* Added fallback color */
		.event-card {
			background-color: #ddd; 
			background-size: cover;
			background-position: center;
			position: relative; 
		}

		main.container {
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
			padding-bottom: 90px;
		}

		/* Saved Card Specific Spacing */
		.saved-card-overlay {
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			height: 100%;
		}

		.saved-card-info {
			margin-bottom: 1rem;
		}

		.saved-card-info h4 {
			margin-bottom: 0.5rem;
		}

		/* Update the remove button to match explore page styling */
		.remove-btn {
			background: var(--color-error, #c0392b);
			color: #fff;
			border: none;
			padding: 0.4rem 0.8rem;
			border-radius: var(--radius);
			cursor: pointer;
			font-size: 0.9rem;
			transition: background 0.2s;
			font-weight: 600;
			white-space: nowrap;
			margin-left: 0.5rem;
		}

		.remove-btn:hover {
			background: #a93226;
		}

		.no-saved {
			text-align: center;
			margin-top: 3rem;
			color: var(--color-text-secondary);
			font-size: 1.1rem;
		}

		/* Filter Modal Styles */
		.filter-modal {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.6);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 999;
		}

		.filter-content {
			background: var(--color-surface);
			padding: var(--spacing-lg);
			border-radius: var(--radius);
			width: 90%;
			max-width: 380px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
			max-height: 85vh;
			overflow-y: auto;
		}
		
		.filter-section-title {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: bold;
			color: var(--color-text-primary);
			border-bottom: 2px solid var(--color-background);
			padding-bottom: 0.2rem;
		}

		.filter-options {
			display: grid;
			gap: var(--spacing-md);
			margin: var(--spacing-md) 0;
		}

		.filter-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.filter-row {
			display: flex;
			gap: 1rem;
		}

		select, input[type="date"] {
			padding: 0.4rem;
			border-radius: 0.4rem;
			border: 1px solid #ccc;
			font-size: 1rem;
			width: 100%;
			background-color: #fff;
		}
		
		.checkbox-label {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			cursor: pointer;
		}

		.modal-actions {
			display: flex;
			justify-content: space-between;
			margin-top: var(--spacing-lg);
			padding-top: var(--spacing-sm);
			border-top: 1px solid var(--color-background);
		}

		.event-card__footer {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: auto;
		}

		.save-star {
			position: absolute;
			top: 15px;
			left: 15px;
			background: none;
			border: none;
			color: gold;
			font-size: 2.8rem; /* Even bigger for top left */
			cursor: pointer;
			padding: 0;
			line-height: 1;
			transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
			z-index: 20; /* Higher z-index to be above overlay */
			width: 60px;
			height: 60px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			backdrop-filter: blur(2px);
		}

		.save-star:hover {
			transform: scale(1.3);
			color: #FFD700;
			text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
		}

		.save-star:active {
			transform: scale(0.9);
		}

		/* Optional glow effect */
		.save-star::after {
			content: '';
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 60px;
			height: 60px;
			background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
			border-radius: 50%;
			z-index: -1;
			opacity: 0;
			transition: opacity 0.3s;
		}

		.save-star:hover::after {
			opacity: 1;
		}

		.save-star.unsaved {
			color: rgba(255, 255, 255, 0.6);
			text-shadow: 0 1px 2px rgba(0,0,0,0.3);
		}

		.save-star.unsaved:hover {
			color: rgba(255, 255, 255, 0.9);
		}

		.page-header {
			text-decoration: none;
			border-bottom: none;
		}

	</style>
</head>

<body>
	<header class="search-header">
		<button class="btn btn-secondary" id="filterBtn">Filter</button>
		
		<select id="sortSelect" class="sort-select">
			<option value="name" selected>Sort: A-Z</option>
			<option value="priceAsc">Price: Low to High</option>
			<option value="priceDesc">Price: High to Low</option>
			<option value="time">Time: Earliest</option>
		</select>

		<div class="search-bar">
			<input type="text" placeholder="Search saved..." id="searchInput">
		</div>
		<a href="../pages/Search.html" class="btn btn-secondary">Back</a>
	</header>

	<main class="container">
		<h1 class="page-header">Saved Events</h1>

		<section class="cards-grid" id="savedEventsSection">
			<p style="text-align:center; margin-top:2rem;">Loading saved events...</p>
		</section>
	</main>

	<div class="filter-modal" id="filterModal">
		<div class="filter-content">
			<h2>Filter Saved</h2>
			<div class="filter-options">
				<div class="filter-group">
					<span class="filter-section-title">Date & Time</span>
					<label>Date: <input type="date" id="filterDate"></label>
					<div class="filter-row">
						<label style="flex:1">Start:
							<select id="startTime"><option value="">Any</option></select>
						</label>
						<label style="flex:1">End:
							<select id="endTime"><option value="">Any</option></select>
						</label>
					</div>
				</div>

				<div class="filter-group">
					<span class="filter-section-title">Category</span>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Hotel"> Hotel</label>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Restaurant"> Restaurant</label>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Attraction"> Attraction</label>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Music"> Music</label>
				</div>

				<div class="filter-group">
					<span class="filter-section-title">Location</span>
					<label class="checkbox-label"><input type="checkbox" name="location" value="Calgary"> Calgary</label>
					<label class="checkbox-label"><input type="checkbox" name="location" value="Banff"> Banff</label>
					<label class="checkbox-label"><input type="checkbox" name="location" value="Canmore"> Canmore</label>
				</div>
			</div>

			<div class="modal-actions">
				<button class="btn btn-secondary" id="closeFilter">Close</button>
				<button class="btn btn-primary" id="applyFilters">Apply</button>
			</div>
		</div>
	</div>

	<nav class="bottom-nav">
		<a href="../pages/Home.html" class="nav-item"><span class="label">Home</span></a>
		<a href="../pages/Itinerary.html" class="nav-item"><span class="label">Itinerary</span></a>
		<a href="../pages/Search.html" class="nav-item"><span class="label"><strong>Search</strong></span></a>
		<a href="../pages/Account.html" class="nav-item"><span class="label">Account</span></a>
	</nav>

	<script src="../assets/js/include.js"></script>
	<script src="../assets/js/main.js"></script>

	<script>
		let savedEventsData = [];
		const STORAGE_KEY = 'user_saved_events';

		const savedSection = document.getElementById('savedEventsSection');
		const searchInput = document.getElementById('searchInput');
		const sortSelect = document.getElementById('sortSelect');
		
		// Function to calculate end time (Used in renderSavedEvents)
		function calculateEndTime(startTime, duration) {
			if (!startTime || !duration) return '';
			const [startHour, startMin] = startTime.split(':').map(Number);
			const totalDurationMins = parseFloat(duration) * 60;
			
			let totalMins = startHour * 60 + startMin + totalDurationMins;
			
			let endHour = Math.floor((totalMins / 60) % 24); 
			let endMin = totalMins % 60;

			return `${String(endHour).padStart(2, '0')}:${String(endMin).padStart(2, '0')}`;
		}


		// 1. Initialize Data (LocalStorage or Fetch)
		function initSavedEvents() {
			const storedData = localStorage.getItem(STORAGE_KEY);

			if (storedData) {
				// Use stored data if it exists (Persisted changes)
				console.log('Loaded saved events from storage');
				savedEventsData = JSON.parse(storedData);
				renderSavedEvents(getFilteredAndSortedSaved());
			} else {
				// First time load: Fetch from JSON and set up storage
				console.log('Fetching default saved events');
				fetch('../assets/data/events.json')
					.then(response => response.json())
					.then(data => {
						// Note: This fetch now gets the corrected JSON with durations for saved events.
						savedEventsData = data.saved;
						// Save initial state to storage so subsequent changes persist
						localStorage.setItem(STORAGE_KEY, JSON.stringify(savedEventsData));
						renderSavedEvents(getFilteredAndSortedSaved());
					})
					.catch(err => {
						console.error('Error fetching events:', err);
						savedSection.innerHTML = '<p class="no-saved">Error loading data. Run with Live Server.</p>';
					});
			}
		}

		// 2. Render Logic
		function renderSavedEvents(data) {
			savedSection.innerHTML = '';
			
			if (data.length === 0) {
				savedSection.innerHTML = '<p class="no-saved">No saved events found.</p>';
				return;
			}

			data.forEach(event => {
				const card = document.createElement('article');
				card.className = 'event-card';
				card.style.backgroundImage = `url('${event.img}')`;
				
				// Click anywhere to go to Info (except star)
				card.onclick = (e) => {
					// Don't navigate if clicking the star
					if (!e.target.closest('.save-star')) {
						window.location.href = `EventBooking.html?id=${event.id}&source=saved`;
					}
				};

				const priceDisplay = event.price === 0 ? 'Free' : `$${event.price}`;
				const dateDisplay = formatDate(event.date);
				
				// FIX: Removed the temporary '|| 2' default value. The logic now correctly relies on event.duration being present in the data.
				const endTime = calculateEndTime(event.time, event.duration);
				const timeRange = endTime ? `${event.time} - ${endTime}` : event.time;


				card.innerHTML = `
					<div class="event-card__overlay">
						<div class="event-card__meta">
							<h4 class="event-card__title">${event.title}</h4>
							<p class="event-card__subtitle">${event.location} • ${dateDisplay}, ${timeRange}</p>
						</div>
						<div class="price-badge">${priceDisplay}</div>
						<button class="favorite-heart saved" title="Remove from saved">❤</button>
					</div>
				`;
				const heartBtn = card.querySelector('.favorite-heart');
				heartBtn.addEventListener('click', (ev) => {
					ev.stopPropagation();
					toggleSaveStar(ev, event.id); // reuse removal logic
				});
				savedSection.appendChild(card);
			});
		}

		function formatDate(dateStr) {
			if(!dateStr) return '';
			const date = new Date(dateStr + 'T00:00:00');
			return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
		}
		
		// 3. Remove Logic (Now Updates LocalStorage)
		window.toggleSaveStar = function(e, id) {
			e.stopPropagation(); // Prevent card click
			
			// Find the event data
			const event = savedEventsData.find(evt => evt.id === id);
			if (!event) return;
			
			// Remove from memory
			savedEventsData = savedEventsData.filter(evt => evt.id !== id);
			
			// Update LocalStorage
			localStorage.setItem(STORAGE_KEY, JSON.stringify(savedEventsData));
			
			// Optional: Show quick feedback
			const starBtn = e.target;
			starBtn.textContent = '☆';
			starBtn.style.color = 'rgba(255,255,255,0.5)';
			starBtn.style.transform = 'scale(0.8)';
			
			// Re-render after short delay for visual feedback
			setTimeout(() => {
				renderSavedEvents(getFilteredAndSortedSaved());
			}, 300);
		};

		// 4. Filter & Sort Logic
		function getFilteredAndSortedSaved() {
			const searchText = searchInput.value.toLowerCase();
			const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);
			const selectedLocations = Array.from(document.querySelectorAll('input[name="location"]:checked')).map(cb => cb.value);
			const filterDate = document.getElementById('filterDate').value;
			const startTime = document.getElementById('startTime').value;
			const endTime = document.getElementById('endTime').value;
			const sortMode = sortSelect.value;

			let filtered = savedEventsData.filter(event => {
				if (!event.title.toLowerCase().includes(searchText)) return false;
				if (selectedCategories.length > 0 && !selectedCategories.includes(event.category)) return false;
				if (selectedLocations.length > 0 && !selectedLocations.includes(event.location)) return false;
				if (filterDate && event.date !== filterDate) return false;
				if (startTime && event.time < startTime) return false;
				if (endTime && event.time > endTime) return false;
				return true;
			});

			filtered.sort((a, b) => {
				if (sortMode === 'priceAsc') return a.price - b.price;
				if (sortMode === 'priceDesc') return b.price - a.price;
				if (sortMode === 'time') return a.time.localeCompare(b.time);
				if (sortMode === 'name') return a.title.localeCompare(b.title); // Default A-Z
				return 0;
			});

			return filtered;
		}

		// Listeners
		searchInput.addEventListener('input', () => renderSavedEvents(getFilteredAndSortedSaved()));
		sortSelect.addEventListener('change', () => renderSavedEvents(getFilteredAndSortedSaved()));

		const filterBtn = document.getElementById('filterBtn');
		const filterModal = document.getElementById('filterModal');
		const closeFilter = document.getElementById('closeFilter');
		const applyFilters = document.getElementById('applyFilters');

		filterBtn.addEventListener('click', () => filterModal.style.display = 'flex');
		closeFilter.addEventListener('click', () => filterModal.style.display = 'none');
		applyFilters.addEventListener('click', () => {
			renderSavedEvents(getFilteredAndSortedSaved());
			filterModal.style.display = 'none';
		});

		function populateTimeDropdown(selectId) {
			const savedSelect = document.getElementById(selectId);
			for (let hour = 0; hour < 24; hour++) {
				for (let min = 0; min < 60; min += 30) {
					const hh = hour.toString().padStart(2, "0");
					const mm = min.toString().padStart(2, "0");
					const label = `${hh}:${mm}`;
					const option = document.createElement("option");
					option.value = label;
					option.textContent = label;
					savedSelect.appendChild(option);
				}
			}
		}
		populateTimeDropdown("startTime");
		populateTimeDropdown("endTime");
		
		// Start
		initSavedEvents();
	</script>
</body>
</html>
