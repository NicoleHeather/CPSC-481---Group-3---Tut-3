<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Itinerary (Day) - Prototype</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <!-- Reuse modal + donut styles from Budget -->
  <link rel="stylesheet" href="../assets/css/budget.css">
  <!-- Reuse itinerary styles for header -->
  <link rel="stylesheet" href="../assets/css/itinerary.css">
  <!-- New, day-view specific styles -->
  <link rel="stylesheet" href="../assets/css/itinerary-day.css">
</head>
<body class="no-header-gap itinerary-fixed">
  <!-- header partial injected by include.js -->

  <main class="container">
    <div class="page-header-row">
      <button id="prev-day" type="button" class="btn header-control left" aria-label="Previous day">Previous</button>
      <h3 id="page-title">Daily View</h3>
      <button id="next-day" type="button" class="btn header-control right" aria-label="Next day">Next</button>
    </div>

    <!-- Date display (rendered by JS) -->
    <div id="day-subtitle" class="week-range" aria-hidden="true" style="margin-top:8px;"></div>

    <!-- Events list container -->
    <section id="calendar" aria-label="Daily schedule"></section>
  </main>

  <!-- Add / Edit Event Modal (created dynamically by JS) -->

  <!-- footer partial injected by include.js -->

  <script src="../assets/js/include.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/itinerary-day.js"></script>
</body>
</html>
