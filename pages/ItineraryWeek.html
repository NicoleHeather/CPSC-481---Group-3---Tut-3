<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Itinerary (Week) - Prototype</title>

  <!-- Global + shared styles -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <!-- Reuse Budget trip-card styles -->
  <link rel="stylesheet" href="../assets/css/budget.css">
  <!-- NEW: lightweight styles for week rows -->
  <link rel="stylesheet" href="../assets/css/itinerary.css">
</head>

<body>

  <main class="container">
    <h1>Itinerary (Week)</h1>

    <!-- LIST of itineraries -->
    <section id="itinerary-list" class="trip-list" aria-label="Itineraries"></section>

    <!-- GOOD POPUP (iw-) -->
    <div id="iw-budget-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="iw-budget-title">
      <div class="modal__panel">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
          <h3 id="iw-budget-title" style="margin:0;">Trip Budget</h3>
          <button id="iw-budget-close" class="btn btn-secondary" type="button" style="margin-left:auto;">Close</button>
        </div>

        <div class="budget-wrap">
          <div class="donut">
            <svg class="donut-svg" viewBox="0 0 200 200">
              <circle class="donut-ring" cx="100" cy="100" r="80" />
              <g id="iw-donut-slices"></g>
              <g class="donut-center">
                <text id="iw-donut-remaining-label" x="100" y="88" text-anchor="middle">Remaining:</text>
                <text id="iw-donut-main" x="100" y="108" text-anchor="middle">$0</text>
                <text id="iw-donut-sub"  x="100" y="130" text-anchor="middle">$0 total</text>
              </g>
            </svg>
          </div>
          <div class="legend" id="iw-donut-legend"></div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
          <button id="iw-add-expense-btn" class="btn" type="button">+ Add Expense</button>
        </div>
      </div>
    </div>
  </main>

  <!-- EXPENSE POPUP -->
  <div id="iw-expense-modal" class="modal hidden">
    <div class="modal__panel">
      <h3 style="margin:0 0 8px;">Add Expense</h3>
      <form id="iw-expense-form">

        <label class="field">
          <span>Item name</span>
          <input id="iw-exp-name" type="text" required>
        </label>

        <label class="field">
          <span>Amount</span>
          <input id="iw-exp-amount" type="number" min="0" step="0.01" required>
        </label>

        <label class="field">
          <span>Category</span>
          <select id="iw-exp-category"></select>
        </label>

        <div class="modal__actions">
          <button type="button" id="iw-exp-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/include.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/itinerary-week.js"></script>
  <script src="../assets/js/budget-popup.js"></script>

</body>
</html>
