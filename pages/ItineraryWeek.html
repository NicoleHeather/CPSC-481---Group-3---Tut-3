<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Itinerary (Week) - Prototype</title>

  <!-- Global + shared styles -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <!-- Reuse Budget trip-card styles -->
  <link rel="stylesheet" href="../assets/css/budget.css">
  <!-- NEW: lightweight styles for week rows -->
  <link rel="stylesheet" href="../assets/css/itinerary.css">
</head>

<body class="no-header-gap itinerary-fixed">

  <main class="container">
    <div class="page-header-row">
      <button id="prev-week" type="button" class="btn header-control left" aria-label="Previous week">Previous</button>
      <h3 id="page-title">Weekly View</h3>
      <button id="next-week" type="button" class="btn header-control right" aria-label="Next week">Next</button>
    </div>

    <!-- Week range display (rendered by JS) -->
    <div id="week-range" class="week-range" aria-hidden="true" style="margin-top:8px;"></div>

    <!-- 8 vertical rectangles: first = trip header, next 7 = Mon..Sun -->
    <section id="week-columns" class="week-columns" aria-label="Week columns">
      <!-- columns rendered by JS -->
    </section>

    <div id="day-details" style="margin-top: 16px;"></div>
  </main>

  <!-- Shared include + site JS (injects header/footer) -->
  <script src="../assets/js/include.js"></script>
  <script src="../assets/js/main.js"></script>

  <!-- Page script -->
  <script src="../assets/js/itinerary-week.js"></script>

</body>
</html>
