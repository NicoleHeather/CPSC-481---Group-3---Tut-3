<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
	<title>Search - Prototype</title>
	<link rel="stylesheet" href="../assets/css/variables.css">
	<link rel="stylesheet" href="../assets/css/main.css">
	<style>
		/* Search Page Specific Styles */
		.search-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: var(--spacing-sm) var(--spacing-md);
			background: var(--color-primary);
			color: #fff;
			gap: 0.5rem;
			/* Allow wrapping so Search can go to top */
			flex-wrap: wrap; 
		}

		.search-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: #fff;
			border-radius: var(--radius);
			padding: 0.4rem 0.8rem;
			
			/* FORCE TOP ROW */
			order: -1; 
			width: 100%;       
			flex-basis: 100%;  
			margin-bottom: 0.2rem;
		}

		.search-bar .icon-btn {
			background: transparent;
			border: 0;
			padding: 6px;
			color: var(--color-primary) !important;
			cursor: pointer;
			margin-left: 8px;
		}

		.search-bar .icon-btn svg { width: 22px; height: 22px; display: block; stroke: var(--color-primary) !important; }

		.search-bar input {
			border: none;
			flex: 1;
			font-size: 1rem;
			outline: none;
			background: transparent;
		}
		
		/* --- ROW 2 CONTROLS --- */
		
		/* 1. Buttons: Don't grow, don't shrink, fit to text */
		.search-header .btn {
			flex: 0 0 auto; 
			padding: 0.4rem 0.8rem;
			text-align: center;
			white-space: nowrap;
			font-weight: 400;
			font-size: 1rem;
		}

		/* 2. Sort: Fill the space BETWEEN the buttons */
		.sort-select {
			background: #fff; 
			color: #333; 
			border: 1px solid transparent;
			padding: 0.4rem 0.2rem;
			border-radius: var(--radius);
			font-size: 0.9rem;
			cursor: pointer;
			text-align: center;

			/* This makes it fill remaining width but stay on the same line */
			flex: 1; 
			min-width: 0; /* Prevents it from forcing a wrap if text is long */
		}
		
		/* Added fallback color to event cards in case image fails */
		.event-card {
			background-color: #ddd; 
			background-size: cover;
			background-position: center;
		}
		
		.sort-select:focus {
			outline: none;
			border-color: var(--color-accent);
		}

		/* Modal Styles */
		.filter-modal {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.6);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 999;
		}

		.filter-content {
			background: var(--color-surface);
			padding: var(--spacing-lg);
			border-radius: var(--radius);
			width: 90%;
			max-width: 380px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
			max-height: 85vh;
			overflow-y: auto;
		}

		.filter-content h2 {
			margin-top: 0;
			text-align: left;
			color: #000;
		}

		.filter-section-title {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: bold;
			color: var(--color-text-primary);
			border-bottom: 2px solid var(--color-background);
			padding-bottom: 0.2rem;
		}

		.filter-options {
			display: grid;
			gap: var(--spacing-md);
			margin: var(--spacing-md) 0;
		}

		.filter-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.filter-row {
			display: flex;
			gap: 0.6rem;
		}

		/* Preset buttons row: wrap neatly inside modal */
		.preset-row {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
		}
		.preset-row .btn {
			flex: 1 1 48%;
			min-width: 0;
			padding: 0.35rem 0.6rem;
			font-size: 0.9rem;
		}
		
		/* Scope input styles to modal only so header search stays clean */
		.filter-content select, .filter-content input[type="date"], .filter-content input[type="text"] {
			padding: 0.35rem;
			border-radius: 0.4rem;
			border: 1px solid #ccc;
			font-size: 0.95rem;
			width: 100%;
			background-color: #fff;
			box-sizing: border-box;
		}

		/* Orange focus ring consistent with btn focus */
		.filter-content select:focus, .filter-content input[type="date"]:focus, .filter-content input[type="text"]:focus {
			outline: 3px solid rgba(255,127,39,0.16);
			outline-offset: 2px;
			border-color: var(--color-accent);
		}

		/* Ensure columns can shrink inside modal */
		.filter-row label { flex: 1; min-width: 0; }

		.checkbox-label {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			cursor: pointer;
		}

		.modal-actions {
			display: flex;
			justify-content: flex-end;
			gap: 0.5rem;
			margin-top: var(--spacing-lg);
			padding-top: var(--spacing-sm);
			border-top: 1px solid var(--color-background);
		}


		main.container {
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
			padding-bottom: 90px;
		}
		
		.no-results {
			text-align: center;
			margin-top: 3rem;
			color: var(--color-text-secondary);
			font-style: italic;
		}

		.page-header {
			text-decoration: none;
			border-bottom: none;
		}
	</style>
</head>

<body>
	<header class="search-header">
		<button class="btn btn-secondary" id="filterBtn">Filter</button>

		<select id="presetAndSortSelect" class="sort-select" aria-label="Date Preset and Sort">
			<option value="upcoming" selected>Dates: Upcoming 30 Days</option>
			<option value="calgary">Dates: Calgary Trip (May 1–14, 2026)</option>
			<option value="banff">Dates: Banff Trip (Jun 10–17, 2026)</option>
			<option value="custom">Dates: Custom (use Filters)</option>
			<option value="divider" disabled>──────────</option>
			<option value="sort-name">Sort: A–Z (Title)</option>
			<option value="sort-priceAsc">Sort: Price Low → High</option>
			<option value="sort-priceDesc">Sort: Price High → Low</option>
		</select>

		<div class="search-bar">
			<input type="text" placeholder="Search..." id="searchInput">
			<button id="searchBtn" class="icon-btn" aria-label="Search">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
			</button>
		</div>
		<a href="../pages/SavedEvents.html" class="btn btn-secondary">Saved</a>
	</header>

	<main class="container">
		<section class="cards-grid" id="eventsGrid">
			<p style="text-align:center; margin-top:2rem;">Loading events...</p>
		</section>
	</main>

	<div class="filter-modal" id="filterModal">
		<div class="filter-content">
			<h2>Filter Events</h2>
			<div class="filter-options">

				<div class="filter-group">
					<span class="filter-section-title">Date & Time</span>
					<div class="preset-row" style="margin-bottom:0.4rem">
						<button type="button" class="btn btn-secondary" id="presetCalgary">Calgary Trip (May 1–14, 2026)</button>
						<button type="button" class="btn btn-secondary" id="presetBanff">Banff Trip (Jun 10–17, 2026)</button>
					</div>
					<div class="filter-row">
						<label style="flex:1">Start Date:
							<input type="date" id="filterStartDate">
						</label>
						<label style="flex:1">End Date:
							<input type="date" id="filterEndDate">
						</label>
					</div>
					<div class="filter-row">
						<label style="flex:1">Start Time:
							<select id="startTime"><option value="">Any</option></select>
						</label>
						<label style="flex:1">End Time:
							<select id="endTime"><option value="">Any</option></select>
						</label>
					</div>
				</div>

				<div class="filter-group">
					<span class="filter-section-title">Category</span>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Hotel"> Hotel</label>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Restaurant"> Restaurant</label>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Attraction"> Attraction</label>
					<label class="checkbox-label"><input type="checkbox" name="category" value="Music"> Music</label>
				</div>

				<div class="filter-group">
					<span class="filter-section-title">Location</span>
					<label class="checkbox-label"><input type="checkbox" name="location" value="Calgary"> Calgary</label>
					<label class="checkbox-label"><input type="checkbox" name="location" value="Banff"> Banff</label>
					<label class="checkbox-label"><input type="checkbox" name="location" value="Canmore"> Canmore</label>
				</div>
			</div>

			<div class="modal-actions">
				<button class="btn-cancel" id="closeFilter">Close</button>
				<button class="btn" id="applyFilters">Apply Filters</button>
			</div>
		</div>
	</div>

	<nav class="bottom-nav">
		<a href="../pages/Home.html" class="nav-item"><span class="label">Home</span></a>
		<a href="../pages/Itinerary.html" class="nav-item"><span class="label">Itinerary</span></a>
		<a href="../pages/Search.html" class="nav-item"><span class="label"><strong>Search</strong></span></a>
		<a href="../pages/Account.html" class="nav-item"><span class="label">Account</span></a>
	</nav>

	<script src="../assets/js/include.js"></script>
	<script src="../assets/js/main.js"></script>
	
	<script>

		let searchEventsData = [];

		const eventsGrid = document.getElementById('eventsGrid');
		const searchInput = document.getElementById('searchInput');
		const sortSelect = document.getElementById('sortSelect');
		const presetAndSortSelect = document.getElementById('presetAndSortSelect');
		let selectedSortMode = null; // 'name' | 'priceAsc' | 'priceDesc' | null
		let shortcut;
		let shortcutApplied = 0

		window.onload = function () {
			const queryString = window.location.search;
    		const urlParams = new URLSearchParams(queryString);
    		console.log(urlParams);

			if (urlParams.length != 0){
			    shortcut = urlParams.get('shortcut');
    			console.log(shortcut);
			}
		};

		// Fetch Data
		fetch('../assets/data/events.json')
			.then(response => response.json())
			.then(data => {
				searchEventsData = data.explore;
				renderEvents(getFilteredAndSortedEvents());
			})
			.catch(err => {
				console.error('Error fetching events:', err);
				eventsGrid.innerHTML = '<p class="no-results">Error loading data. Run with Live Server.</p>';
			});

		// NEW: Function to calculate end time
		function calculateEndTime(startTime, duration) {
			if (!startTime || !duration) return '';
			const [startHour, startMin] = startTime.split(':').map(Number);
			const totalDurationMins = parseFloat(duration) * 60;
			
			let totalMins = startHour * 60 + startMin + totalDurationMins;
			
			// Ensure the end time wraps around if it exceeds 24 hours (e.g., a multi-day event)
			let endHour = Math.floor((totalMins / 60) % 24); 
			let endMin = totalMins % 60;

			return `${String(endHour).padStart(2, '0')}:${String(endMin).padStart(2, '0')}`;
		}


		// Render Logic
		function renderEvents(data) {
			eventsGrid.innerHTML = '';
			
			if (data.length === 0) {
				eventsGrid.innerHTML = '<p class="no-results">No events found matching your criteria.</p>';
				return;
			}

			// Helpers to manage saved favorites
			const STORAGE_KEY = 'user_saved_events';
			const getSaved = () => {
				try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
			};
			const isSaved = (id) => getSaved().some(e => e.id === id);
			const saveEvent = (evt) => {
				const saved = getSaved();
				if (!saved.some(e => e.id === evt.id)) {
					localStorage.setItem(STORAGE_KEY, JSON.stringify([...saved, evt]));
				}
			};
			const removeEvent = (id) => {
				const saved = getSaved().filter(e => e.id !== id);
				localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
			};
			const toggleFavorite = (evtObj, e) => {
				e.stopPropagation();
				if (isSaved(evtObj.id)) removeEvent(evtObj.id); else saveEvent(evtObj);
				// Update heart visual
				const btn = e.currentTarget;
				btn.classList.toggle('saved', isSaved(evtObj.id));
				btn.textContent = isSaved(evtObj.id) ? '❤' : '♡';
			};

			data.forEach(event => {
				const card = document.createElement('article');
				card.className = 'event-card';
				// Preload image and fallback to city-based local image if it fails
				const preImg = new Image();
				preImg.referrerPolicy = 'no-referrer';
				// Start with location-based fallback, then upgrade to event image on load
				(function setInitialFallback(){
					let fb;
					const loc = (event.location || '').toLowerCase();
					if (loc.includes('calgary')) fb = '../assets/img/calgary.jpg';
					else if (loc.includes('banff')) fb = '../assets/img/banff.jpg';
					else if (loc.includes('canmore')) fb = '../assets/img/cheakamus-lake-as-seen.jpg';
					else fb = 'linear-gradient(135deg, #999 0%, #bbb 50%, #ddd 100%)';
					card.style.backgroundImage = typeof fb === 'string' && (fb.startsWith('http') || fb.startsWith('..')) ? `url('${fb}')` : fb;
				})();
				preImg.onload = () => { card.style.backgroundImage = `url('${event.img}')`; };
				preImg.onerror = () => {
					let fallback;
					const loc = (event.location || '').toLowerCase();
					if (loc.includes('calgary')) fallback = '../assets/img/calgary.jpg';
					else if (loc.includes('banff')) fallback = '../assets/img/banff.jpg';
					else if (loc.includes('canmore')) fallback = '../assets/img/cheakamus-lake-as-seen.jpg';
					else fallback = 'linear-gradient(135deg, #999 0%, #bbb 50%, #ddd 100%)';
					card.style.backgroundImage = typeof fallback === 'string' && (fallback.startsWith('http') || fallback.startsWith('..'))
						? `url('${fallback}')`
						: fallback;
				};
				// Cache-bust to avoid stale failures
				const cacheBust = `${event.img}${event.img.includes('?') ? '&' : '?'}v=${Date.now()}`;
				preImg.src = cacheBust;
				
				// CHANGE: Added ID and Source parameter to the URL
				card.onclick = () => window.location.href = `EventBooking.html?id=${event.id}&source=explore`;

				const priceDisplay = event.price === 0 ? 'Free' : `$${event.price}`;
				const dateDisplay = formatDate(event.date);
				
				// NEW: Calculate and format the 24-hour time range
				const endTime = calculateEndTime(event.time, event.duration);
				const timeRange = endTime ? `${event.time} - ${endTime}` : event.time; // Display start-end or just start

				card.innerHTML = `
					<div class="event-card__overlay">
						<div class="event-card__meta">
							<h4 class="event-card__title">${event.title}</h4>
							<p class="event-card__subtitle">${event.location} • ${dateDisplay}, ${timeRange}</p>
						</div>
						<div class="price-badge">${priceDisplay}</div>
						<button class="favorite-heart ${isSaved(event.id) ? 'saved' : ''}" title="${isSaved(event.id) ? 'Saved' : 'Save'}">
							${isSaved(event.id) ? '❤' : '♡'}
						</button>
					</div>
				`;
				// Attach handler after DOM set
				const heartBtn = card.querySelector('.favorite-heart');
				heartBtn.addEventListener('click', (ev) => toggleFavorite(event, ev));
				eventsGrid.appendChild(card);
			});
		}

		function formatDate(dateStr) {
			if(!dateStr) return '';
			const date = new Date(dateStr + 'T00:00:00');
			return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
		}
		
		// REMOVED: convertTo12Hour function

		// Filter & Sort Logic
		function getFilteredAndSortedEvents() {
			const searchText = searchInput.value.toLowerCase();

			if (shortcut && shortcutApplied != 1) {
				document.querySelector('input[name="category"][value="' + shortcut + '"]').checked = true;
				shortcutApplied++;
			}

			const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);
			const selectedLocations = Array.from(document.querySelectorAll('input[name="location"]:checked')).map(cb => cb.value);
			const filterStartDate = document.getElementById('filterStartDate').value;
			const filterEndDate = document.getElementById('filterEndDate').value;
			const startTime = document.getElementById('startTime').value;
			const endTime = document.getElementById('endTime').value;
			const sortMode = selectedSortMode;

			// Default upcoming window: next 30 days, only when no explicit date filters are set
			const hasExplicitDateFilter = !!(filterStartDate || filterEndDate);
			const today = new Date();
			today.setHours(0,0,0,0);
			const upcomingEnd = new Date(today);
			upcomingEnd.setDate(upcomingEnd.getDate() + 30);

			let filtered = searchEventsData.filter(event => {
				if (!event.title.toLowerCase().includes(searchText)) return false;
				if (selectedCategories.length > 0 && !selectedCategories.includes(event.category)) return false;
				if (selectedLocations.length > 0 && !selectedLocations.includes(event.location)) return false;
				// Date range filter
				if (filterStartDate || filterEndDate) {
					const ev = new Date(event.date + 'T00:00:00');
					if (filterStartDate) {
						const s = new Date(filterStartDate + 'T00:00:00');
						if (ev < s) return false;
					}
					if (filterEndDate) {
						const e = new Date(filterEndDate + 'T00:00:00');
						if (ev > e) return false;
					}
				} else {
					// No explicit date filters: show only upcoming (today..today+30)
					const ev = new Date(event.date + 'T00:00:00');
					if (ev < today || ev > upcomingEnd) return false;
				}
				if (startTime && event.time < startTime) return false;
				if (endTime && event.time > endTime) return false;
				return true;
			});

			// Sort chronologically by date then time ascending
			filtered.sort((a, b) => {
				const ad = new Date(a.date + 'T00:00:00');
				const bd = new Date(b.date + 'T00:00:00');
				if (ad.getTime() !== bd.getTime()) return ad - bd;
				// Compare times (HH:MM 24h)
				const [ah, am] = a.time.split(':').map(Number);
				const [bh, bm] = b.time.split(':').map(Number);
				return (ah * 60 + am) - (bh * 60 + bm);
			});

			// Optional price sort applied only when selected
			if (sortMode === 'name') {
				filtered.sort((a, b) => a.title.localeCompare(b.title));
			} else if (sortMode === 'priceAsc') {
				filtered.sort((a, b) => a.price - b.price);
			} else if (sortMode === 'priceDesc') {
				filtered.sort((a, b) => b.price - a.price);
			}

			return filtered;
		}

		// Listeners
		searchInput.addEventListener('input', () => renderEvents(getFilteredAndSortedEvents()));
		presetAndSortSelect.addEventListener('change', () => {
			const s = document.getElementById('filterStartDate');
			const e = document.getElementById('filterEndDate');
			const val = presetAndSortSelect.value;
			if (val.startsWith('sort-')) {
				selectedSortMode = val.replace('sort-', '');
			} else {
				// Changing date preset clears sort selection
				selectedSortMode = null;
				if (val === 'upcoming') {
					// Clear explicit dates to enable upcoming 30-day default
					s.value = '';
					e.value = '';
				} else if (val === 'calgary') {
					s.value = '2026-05-01';
					e.value = '2026-05-14';
				} else if (val === 'banff') {
					s.value = '2026-06-10';
					e.value = '2026-06-17';
				} else {
					// custom: do nothing; user sets via Filters
				}
			}
			renderEvents(getFilteredAndSortedEvents());
		});
		const searchBtn = document.getElementById('searchBtn');
		searchBtn.addEventListener('click', () => {
			renderEvents(getFilteredAndSortedEvents());
		});

		const filterBtn = document.getElementById('filterBtn');
		const filterModal = document.getElementById('filterModal');
		const closeFilter = document.getElementById('closeFilter');
		const applyFilters = document.getElementById('applyFilters');
		const presetCalgary = document.getElementById('presetCalgary');
		const presetBanff = document.getElementById('presetBanff');

		filterBtn.addEventListener('click', () => filterModal.style.display = 'flex');
		closeFilter.addEventListener('click', () => filterModal.style.display = 'none');
		applyFilters.addEventListener('click', () => {
			renderEvents(getFilteredAndSortedEvents());
			filterModal.style.display = 'none';
		});

		presetCalgary.addEventListener('click', () => {
			const s = document.getElementById('filterStartDate');
			const e = document.getElementById('filterEndDate');
			s.value = '2026-05-01';
			e.value = '2026-05-14';
			renderEvents(getFilteredAndSortedEvents());
		});
		presetBanff.addEventListener('click', () => {
			const s = document.getElementById('filterStartDate');
			const e = document.getElementById('filterEndDate');
			s.value = '2026-06-10';
			e.value = '2026-06-17';
			renderEvents(getFilteredAndSortedEvents());
		});

		function populateTimeDropdown(selectId) {
			const select = document.getElementById(selectId);
			for (let hour = 0; hour < 24; hour++) {
				for (let min = 0; min < 60; min += 30) {
					const hh = hour.toString().padStart(2, "0");
					const mm = min.toString().padStart(2, "0");
					const label = `${hh}:${mm}`;
					const option = document.createElement("option");
					option.value = label;
					option.textContent = label;
					select.appendChild(option);
				}
			}
		}
		populateTimeDropdown("startTime");
		populateTimeDropdown("endTime");
	</script>
</body>
</html>
