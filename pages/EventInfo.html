<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Event Info - Prototype</title>
	<link rel="stylesheet" href="../assets/css/variables.css">
	<link rel="stylesheet" href="../assets/css/main.css">
	<link rel="stylesheet" href="../assets/css/eventInfo.css">
	<!--For modal and input styling -->
</head>

<body id="whole-page">
	<!-- header partial will be injected here -->

	 <!-- Need to update input for cost and start times to num instead of string-->

	<main class="container">

		<!-- Event Info Container -->

		<div class="event">
			<div id="event-info">
				<h1 id="event-title-stored">Chilis Reservation</h1>
				<div class="event-photo">
					<img id="current-img" style="width:100%;height:100%;" src="../assets/img/full-logo-v2.png" alt="Event Image">
				</div>
				<div id="event-date" style="display:flex">
					<label style="font-weight:bold;">Date: </label>
					<div style="margin-left:2%" id="current-date">January 17th, 2025</div>
				</div>
				<div id="event-start" style="display:flex;">
					<label style="font-weight:bold;">Start: </label>
					<div style="margin-left:2%" id="current-start">6 PM</div>
				</div>
				<div id="event-end" style="display:flex;">
					<label style="font-weight:bold;">End:</label>
					<div style="margin-left:2%;" id="current-end">8 PM</div>
				</div>
				<div id="event-location" style="display:flex">
					<label style="font-weight:bold;">Location: </label>
					<div style="margin-left:2%" id="current-location">184 Road St.</div>
				</div>
				<div id="event-cost" style="display:flex">
					<label style="font-weight:bold;">Expected Cost: </label>
					<div style="margin-left:2%" id="current-cost">120$</div>
				</div>
				<div id="event-description">
					<label style="font-weight:bold;">Description: </label>
					<div id="current-description">Restaurant reservation at Chili's for 4 people. Note to self: remember
						to bring John's birthday gift.</div>
				</div>
			</div>
			<div class="event-options">
				<button class="btn btn-secondary" id="event-edit-btn">Edit</button>
				<div class="modal">
					<div class="modal__form">
						<div id="editPopupForm">
							<h3 id="event-title" style="margin:0 0 8px;">Edit Event</h3>
							<div action="" id="event-form" class="modal__form">
								<label class="field">
									<span>Title</span>
									<input id="ev-title" type="text">
								</label>

								<label class="field">
									<span>Date</span>
									<input id="ev-date" type="text">
								</label>

								<div class="field" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
									<label class="field" style="margin:0">
										<span>Start time</span>
										<select id="ev-start" size="1" required>
											<optgroup label="Start Time" id="start-time-options">
												<option value="12 AM"> 0:00 </option>
												<option value="1 AM"> 1:00 </option>
												<option value="2 AM"> 2:00 </option>
												<option value="3 AM"> 3:00 </option>
												<option value="4 AM"> 4:00 </option>
												<option value="5 AM"> 5:00 </option>
												<option value="6 AM"> 6:00 </option>
												<option value="7 AM"> 7:00 </option>
												<option value="8 AM"> 8:00 </option>
												<option value="9 AM"> 9:00 </option>
												<option value="10 AM"> 10:00 </option>
												<option value="11 AM"> 11:00 </option>
												<option value="12 PM"> 12:00 </option>
												<option value="1 PM"> 13:00 </option>
												<option value="2 PM"> 14:00 </option>
												<option value="3 PM"> 15:00 </option>
												<option value="4 PM"> 16:00 </option>
												<option value="5 PM"> 17:00 </option>
												<option value="6 PM"> 18:00 </option>
												<option value="7 PM"> 19:00 </option>
												<option value="8 PM"> 20:00 </option>
												<option value="9 PM"> 21:00</option>
												<option value="10 PM"> 22:00 </option>
										    	<option value="11 PM"> 23:00 </option>
											</optgroup>
										</select>
									</label>
									<label class="field" style="margin:0">
										<span>Duration</span>
										<select label="Duration" id="ev-dur" required>
											<option value="0.5">30 min</option>
											<option value="1" selected>1 hour</option>
											<option value="1.5">1.5 hours</option>
											<option value="2">2 hours</option>
											<option value="2.5">2.5 hours</option>
											<option value="3">3 hours</option>
											<option value="3.5">3.5 hours</option>
											<option value="4">4 hours</option>
											<option value="4.5">4.5 hours</option>
											<option value="5">5 hours</option>
											<option value="5.5">5.5 hours</option>
											<option value="6">6 hours</option>
										</select>
									</label>
								</div>

								<label class="field">
									<span>End time</span>
									<input id="ev-end" type="text">
								</label>

								<label class="field">
									<span>Location</span>
									<input id="ev-location" type="text">
								</label>

								<label class="field">
									<span>Expected Cost</span>
									<input id="ev-cost" type="text" min="0" step="0.01">
								</label>

								<label class="field">
									<span>Description</span>
									<textarea id="ev-notes" placeholder="Add any details…" maxlength="300"
										rows="4"></textarea>
									<div id="ev-count"
										style="font-size:12px; color:var(--color-muted); margin-top:4px;">0 /
										300
									</div>
								</label>

								<div class="modal__actions" style="margin-left:80px">
									<button type="button" id="ev-cancel" class="btn btn-secondary">Cancel</button>
									<button type="submit" class="btn" id="save-btn">Save</button>
								</div>
								<div id="ev-error" style="color:#c8102e; font-size:13px; margin-top:4px; display:none;">
								</div>
							</div>
						</div>
					</div>
				</div>
				<button id="event-remove-btn" class="btn btn-secondary">Remove</button>
				<div class="modal-2">
					<div id="removePopupForm">
						<form>
							<img style="width:25%;height:5%;" src="../assets/img/R.png" alt="Chili's">
							<br>
							<p>
								Are you sure you want to remove this event?
							</p>
							<br>
							<div id="remove-btns">
								<input class="btn btn-primary" id="cancel-remove" type="submit" value="Delete">
								<input class="btn btn-secondary" id="yes-remove" type="button" value="Cancel">
							</div>
						</form>
					</div>
				</div>
				<a id="event-share-btn" href="../pages/Share.html" class="btn btn-secondary">Share</a>
			</div>
		</div>

	</main>
	<script src="../assets/js/include.js"></script>
	<script src="../assets/js/main.js"></script>
	<script src="../assets/js/popupEventInfo.js"></script>
</body>

</html>
