    function convertTo12Hour(time) {
        if (!time) return '';
        let [hours, mins] = time.split(':');
        hours = parseInt(hours);
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${hours}:${mins} ${ampm}`;
    }

    function calculateEndTime(startTime, duration) {
        if (!startTime || !duration) return '';
        let [hours, mins] = startTime.split(':');
        hours = parseInt(hours);
        mins = parseInt(mins);
        
        // Add duration to start time
        const durationHours = Math.floor(duration);
        const durationMins = Math.round((duration - durationHours) * 60);
        
        hours += durationHours;
        mins += durationMins;
        
        // Handle minute overflow
        if (mins >= 60) {
            hours += Math.floor(mins / 60);
            mins = mins % 60;
        }
        
        // Handle hour overflow (24-hour format)
        hours = hours % 24;
        
        // Convert to 12-hour format
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        
        const minsStr = mins < 10 ? '0' + mins : mins;
        return `${hours}:${minsStr} ${ampm}`;
    }

    function updatePage() {
        if (!window.currentEvent) {
            console.error('No current event to update page');
            return;
        }
        
        console.log('Updating page for:', window.currentEvent.title);
        
        document.getElementById('page-title').textContent = window.currentEvent.title;
        if (window.currentEvent.img) {
            document.getElementById('page-image').src = window.currentEvent.img;
        }
        document.getElementById('booking-request-btn').href = 
            `../pages/BookingRequest.html?id=${window.currentEvent.id}&title=${encodeURIComponent(window.currentEvent.title)}`;
        
        // Update date and time
        if (window.currentEvent.date) {
            const dateObj = new Date(window.currentEvent.date);
            const formattedDate = dateObj.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('page-date').textContent = formattedDate;
        }
        
        if (window.currentEvent.time) {
            const startTime = convertTo12Hour(window.currentEvent.time);
            const endTime = calculateEndTime(window.currentEvent.time, window.currentEvent.duration);
            const durationText = window.currentEvent.duration ? ` (${window.currentEvent.duration}H)` : '';
            document.getElementById('page-time').textContent = startTime + ' – ' + endTime + durationText;
        }
        
        if (window.currentEvent.location) {
            document.getElementById('page-location').textContent = window.currentEvent.location;
        }
        
        if (window.currentEvent.price !== undefined) {
            const priceDisplay = window.currentEvent.price === 0 ? 'Free' : `$${window.currentEvent.price.toFixed(2)}`;
            document.getElementById('page-price').textContent = priceDisplay;
        }
        
        // Update description if it exists
        const descriptionEl = document.getElementById('page-description');
        if (descriptionEl && window.currentEvent.description) {
            descriptionEl.textContent = window.currentEvent.description;
        }
        
        updateSaveButton();
    }

        function setupSaveButton() {
            const saveBtn = document.getElementById('save-btn');

                    if (window.currentEvent) {

                        console.log('Current saved state:', isSaved ? 'SAVED' : 'NOT SAVED');

                        if (isSaved) {
                            unsaveEvent(window.currentEvent);
                        } else {

                        }
                    } else {

                    }
                };
            }
        }

            if (modal) {

                        closeSavePopup();
                    }
                });
            }

            // Escape key to close modal
            document.addEventListener('keydown', function (e) {

    // Update save button appearance
    function updateSaveButton() {
        const saveBtn = document.getElementById('save-btn');
        const heartIcon = document.querySelector('.heart-icon');
        
        if (!saveBtn || !heartIcon) {
            console.error('Save button or heart icon not found');
            return;
        }
        
        if (!window.currentEvent) {
            console.error('No current event for updateSaveButton');
            heartIcon.style.fill = 'none';
            heartIcon.style.color = '#6b7280';
            return;
        }
        
        const savedEvents = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const isSaved = savedEvents.some(e => e.id === window.currentEvent.id);
        
        console.log('updateSaveButton - Is saved?', isSaved, 'for event:', window.currentEvent.id);
        
        if (isSaved) {
            heartIcon.style.fill = 'var(--color-primary)';
            heartIcon.style.color = 'var(--color-primary)';
        } else {
            heartIcon.style.fill = 'none';
            heartIcon.style.color = '#6b7280';
        }
    }

    // Save event function
    function saveEvent(event) {
        console.log('Saving event:', event.title, 'ID:', event.id);
        
        let savedEvents = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        
        // Check if already saved
        if (!savedEvents.some(e => e.id === event.id)) {
            savedEvents.push(event);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedEvents));
            
            console.log('Event saved to localStorage. Total saved:', savedEvents.length);
            
            // Show popup notification
            showSavePopup(event.title);
            
            // Update button
            updateSaveButton();
        } else {
            console.log('Event already saved');
        }
    }

    // Unsave event function
    function unsaveEvent(event) {
        console.log('Unsaving event:', event.title, 'ID:', event.id);
        
        let savedEvents = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const initialLength = savedEvents.length;
        
        savedEvents = savedEvents.filter(e => e.id !== event.id);
        
        if (savedEvents.length !== initialLength) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedEvents));
            
            console.log('Event removed from localStorage. Remaining:', savedEvents.length);
            
            // Show popup notification
            showUnsavePopup(event.title);
            
            // Update button
            updateSaveButton();
        }
    }

        function showUnsavePopup(eventTitle = '') {

            const modal = document.getElementById('save-modal');
            const savePopup = document.getElementById('save-success-popup');
            const unsavePopup = document.getElementById('unsave-success-popup');
