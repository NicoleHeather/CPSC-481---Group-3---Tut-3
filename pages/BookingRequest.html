<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Booking Request - Prototype</title>
	<link rel="stylesheet" href="../assets/css/variables.css">
	<link rel="stylesheet" href="../assets/css/main.css">
	<link rel="stylesheet" href="../assets/css/budget.css">
	<link rel="stylesheet" href="../assets/css/bookingRequestScreen.css">
</head>
<body>
	<!-- header partial will be injected here -->

	<main class="container">
		<div class="booking-request__panel">
			<h1 id="page-title" style="margin-bottom: 1.5rem;">Booking Request</h1>
			
			<form id="booking-form" class="modal__form">
				<div class="field">
					<svg class="evd-label" title="Event" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
					<div class="field-input-wrapper">
						<input type="text" id="event-name-booking" name="event-name" placeholder="Event" disabled>
					</div>
				</div>

				<div class="field">
					<svg class="evd-label" title="Date" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
					<div class="field-input-wrapper">
						<input type="text" id="date" name="date" placeholder="Date" disabled>
					</div>
				</div>

				<div class="field">
					<svg class="evd-label" title="Time" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
					<div class="field-input-wrapper">
						<input type="text" id="time" name="time" placeholder="Time" disabled>
					</div>
				</div>

				<div class="field">
					<svg class="evd-label" title="Name" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M 6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path></svg>
					<div class="field-input-wrapper">
						<input type="text" id="name" name="name" placeholder="Enter your full name">
						<div class="field-error" id="name-error"></div>
					</div>
				</div>

				<div class="field">
					<svg class="evd-label" title="Email" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
					<div class="field-input-wrapper">
						<input type="email" id="email" name="email" placeholder="example@gmail.com">
						<div class="field-error" id="email-error"></div>
					</div>
				</div>

				<div class="field">
					<svg class="evd-label" title="Phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
					<div class="field-input-wrapper">
						<input type="text" id="phone" name="phone" placeholder="XXX-XXX-XXXX">
						<div class="field-error" id="phone-error"></div>
					</div>
				</div>

				<div class="field">
					<svg class="evd-label" title="Guests" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
					<div class="field-input-wrapper">
						<input type="number" id="guest-number" name="guest-number" placeholder="0-20">
						<div class="field-error" id="guest-number-error"></div>
					</div>
				</div>

				<div class="modal__actions">
						<button type="button" class="btn btn-cancel" id="booking-cancel">Cancel</button>
						<button type="submit" class="btn" id="submit-info-btn">Send Request</button>
				</div>

				<!-- Booking Request Popup Modal -->
				<div class="modal" id="booking-request-modal" style="display:none; position:fixed; inset:0; z-index:1000;">
					<div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem;">
						<div class="modal__panel" style="background: #fff; border-radius: 18px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); padding: 2rem; max-width: 400px; width:100%;">
							<div style="text-align:center; margin-bottom:1.5rem;">
								<img src="../assets/img/Checkmark.png" alt="Success" style="width:60px; height:60px; margin-bottom:1rem;">
								<h3 style="color:var(--color-primary); font-size:1.125rem; font-weight:700; margin:0;">Booking Request Sent!</h3>
							</div>
							<div class="field" style="margin-bottom:1.2rem; display:flex; flex-direction:column; align-items:stretch;">
								<label for="modal-itinerary-select" style="margin-bottom:0.5rem; font-size:1rem; font-weight:500; color:var(--color-text);">Add to Itinerary (Optional)</label>
								<select id="modal-itinerary-select" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid #ddd; font-size:1rem;">
									<option value="">Select an itinerary</option>
								</select>
							</div>
							<div style="display:flex; gap:12px; justify-content:center;">
								<button class="btn btn-cancel" id="modal-booking-back" style="flex:1;">Cancel</button>
								<button class="btn" id="modal-booking-add" style="flex:1; background: linear-gradient(90deg, #ff7f27 0%, #ff3c6e 100%); color:#fff;">Add to Itinerary</button>
							</div>
						</div>
					</div>

						<!-- Missing required fields modal -->
						<div class="modal" id="missing-container" style="display:none; position:fixed; inset:0; z-index:1100;">
							<div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem;">
								<div class="modal__panel" style="background: #fff; border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,0.12); padding: 1.5rem; max-width: 420px; width:100%; text-align:center;">
									<h3 style="margin-top:0; margin-bottom:0.5rem; color:var(--color-primary); font-size:1.125rem;">Missing required fields</h3>
									<p style="margin:0 0 1rem 0; color:var(--color-text);">Please complete the highlighted fields before sending your request.</p>
									<div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
										<button id="missing-required-info-ok" class="btn">OK</button>
									</div>
								</div>
							</div>
						</div>
				</div>
			</form>
		</div>
	</main>

	<!-- Custom Booking Request Popup Modal -->
	<!--#include file="../partials/custom-booking-modal.html" -->
		<div class="modal__panel" id="processing-container" style="display: none; flex-direction: column; gap: 16px; text-align: center; align-items: center;">
			<img style="width: 60px; height: 60px;" src="../assets/img/refresh.png" alt="Loading">
			<p style="margin: 0; font-size: 1.125rem; font-weight: 500; color: var(--color-text);">Processing your request...</p>
		</div>
	</div>

	<!-- footer partial will be injected here -->

	<script src="../assets/js/include.js"></script>
	<script src="../assets/js/main.js"></script>
	<script src="../assets/js/popupBooking.js"></script>
	<script src="../assets/js/popupBookingRequest.js"></script>
	<script>
		// Time formatting functions
		function convertTo12Hour(time) {
			if (!time) return '';
			const [hours, minutes] = time.split(':');
			let hour = parseInt(hours);
			const ampm = hour >= 12 ? 'PM' : 'AM';
			hour = hour % 12 || 12;
			return `${hour}:${minutes} ${ampm}`;
		}

		function calculateEndTime(startTime, duration = 120) {
			if (!startTime) return '';
			const [hours, minutes] = startTime.split(':');
			let totalMinutes = parseInt(hours) * 60 + parseInt(minutes) + duration;
			const endHours = Math.floor(totalMinutes / 60) % 24;
			const endMinutes = totalMinutes % 60;
			const ampm = endHours >= 12 ? 'PM' : 'AM';
			const displayHours = endHours % 12 || 12;
			return `${String(displayHours).padStart(2, '0')}:${String(endMinutes).padStart(2, '0')} ${ampm}`;
		}

		// Validation helper functions
		function showFieldError(input, errorEl, message) {
			if (input && errorEl) {
				input.classList.add('evd-invalid');
				errorEl.innerHTML = `<svg viewBox="0 0 16 16" fill="none" style="width:16px;height:16px;vertical-align:middle;"><circle cx="8" cy="8" r="7" fill="#ff7f27"/><path d="M8 4v5M8 11h.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>${message}`;
			}
		}

		function clearFieldError(input, errorEl) {
			if (input && errorEl) {
				input.classList.remove('evd-invalid');
				errorEl.textContent = '';
			}
		}

		// Handle prefilling the booking form
		window.addEventListener('load', function() {
			const urlParams = new URLSearchParams(window.location.search);
			const eventTitle = urlParams.get('title');
			const eventDate = urlParams.get('date');
			const eventTime = urlParams.get('time');

			if (eventTitle) {
				document.getElementById('event-name-booking').value = eventTitle;
			}
			if (eventDate) {
				document.getElementById('date').value = eventDate;
			}
			if (eventTime) {
				const startTime = convertTo12Hour(eventTime);
				const endTime = calculateEndTime(eventTime);
				document.getElementById('time').value = `${startTime} - ${endTime}`;
			}

			// Get form elements
			const bookingForm = document.getElementById('booking-form');
			const nameInput = document.getElementById('name');
			const emailInput = document.getElementById('email');
			const phoneInput = document.getElementById('phone');
			const guestNumberInput = document.getElementById('guest-number');
			const nameError = document.getElementById('name-error');
			const emailError = document.getElementById('email-error');
			const phoneError = document.getElementById('phone-error');
			const guestNumberError = document.getElementById('guest-number-error');

			const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

			// Real-time validation - clear errors on input and update submit state
			// Do not show validation feedback until the user clicks Send Request.
			// No real-time clearing of errors here; validation runs on submit.
			nameInput.addEventListener('input', function(){});
			emailInput.addEventListener('input', function(){});
			phoneInput.addEventListener('input', function(){});
			guestNumberInput.addEventListener('input', function(){});

			// Handle cancel button
			const cancelBtn = document.getElementById('booking-cancel');
			if (cancelBtn) {
				cancelBtn.addEventListener('click', function() {
					window.history.back();
				});
			}

			// Handle modal close buttons
			const bookingModal = document.getElementById('booking-modal');
			const backButtons = [
				document.getElementById('booking-request-cancel'),
				document.getElementById('booking-request-conflict-ok'),
				document.getElementById('missing-required-info-ok')
			];

			backButtons.forEach(btn => {
				if (btn) {
					btn.addEventListener('click', function() {
						if (bookingModal) {
							bookingModal.classList.remove('open');
						}
					});
				}
			});

			// Missing required fields modal OK handler (hide modal)
			const missingOkBtn = document.getElementById('missing-required-info-ok');
			if (missingOkBtn) {
				missingOkBtn.addEventListener('click', function(){
					const missingContainer = document.getElementById('missing-container');
					if (missingContainer) missingContainer.style.display = 'none';
				});
			}

			// Ensure the Cancel button in the sent modal closes it
			const sentCancelBtn = document.getElementById('modal-booking-back');
			if (sentCancelBtn) {
				sentCancelBtn.addEventListener('click', function(){
					const bookingReq = document.getElementById('booking-request-modal');
					if (bookingReq) bookingReq.style.display = 'none';
					// also remove any 'open' class used elsewhere
					if (bookingReq && bookingReq.classList) bookingReq.classList.remove('open');
				});
			}

			// Handle Add to Itinerary button
			const addToItineraryBtn = document.getElementById('booking-request-confirm');
			if (addToItineraryBtn) {
				addToItineraryBtn.addEventListener('click', function() {
					const itinerarySelect = document.getElementById('choose-itinerary');
					const selectedItinerary = itinerarySelect.value;
					
					if (selectedItinerary) {
						// Store the new event details
						const eventData = {
							title: document.getElementById('event-name-booking').value,
							date: document.getElementById('date').value,
							time: document.getElementById('time').value,
							name: document.getElementById('name').value,
							email: document.getElementById('email').value,
							phone: document.getElementById('phone').value,
							guests: document.getElementById('guest-number').value
						};
						
						// Store in sessionStorage
						sessionStorage.setItem('newEventData', JSON.stringify(eventData));
						sessionStorage.setItem('newEventTrip', selectedItinerary);
						
						// Navigate to the weekly itinerary view
						window.location.href = `../pages/ItineraryWeek.html?trip=${encodeURIComponent(selectedItinerary)}`;
					} else {
						// If no itinerary selected, just close the modal
						if (bookingModal) {
							bookingModal.classList.remove('open');
						}
					}
				});
			}

			// Handle form submission
			if (bookingForm) {
				bookingForm.addEventListener('submit', function(e) {
					e.preventDefault();
					let hasErrors = false;

					// Validate name
					if (!nameInput.value.trim()) {
						showFieldError(nameInput, nameError, 'Name is required');
						hasErrors = true;
					} else {
						clearFieldError(nameInput, nameError);
					}

					// Validate email
					if (!emailInput.value.trim()) {
						showFieldError(emailInput, emailError, 'Email is required');
						hasErrors = true;
					} else if (!emailRegex.test(emailInput.value)) {
						showFieldError(emailInput, emailError, 'Please enter a valid email');
						hasErrors = true;
					} else {
						clearFieldError(emailInput, emailError);
					}

					// Validate guest number
					if (!guestNumberInput.value) {
						showFieldError(guestNumberInput, guestNumberError, 'Number of guests is required');
						hasErrors = true;
					} else if (guestNumberInput.value < 1 || guestNumberInput.value > 20) {
						showFieldError(guestNumberInput, guestNumberError, 'Must be between 1 and 20 guests');
						hasErrors = true;
					} else {
						clearFieldError(guestNumberInput, guestNumberError);
					}

					if (!hasErrors) {
						console.log('Form is valid, submitting...');
						// Hide missing container if present
						const missingContainer = document.getElementById('missing-container');
						if (missingContainer) missingContainer.style.display = 'none';
						// Load itineraries into the booking-request modal select
						fetch('../assets/data/trips.json')
							.then(response => response.json())
							.then(data => {
								const itinerarySelect = document.getElementById('modal-itinerary-select');
								const trips = (data && data.trips) || [];
								// Clear existing options except the first one
								if (itinerarySelect) {
									while (itinerarySelect.options.length > 1) itinerarySelect.remove(1);
									trips.forEach(trip => {
										const option = document.createElement('option');
										option.value = trip.id;
										option.textContent = trip.title;
										itinerarySelect.appendChild(option);
									});
								}
							})
							.catch(error => console.error('Error loading itineraries:', error))
							.finally(() => {
								// Show the booking-request modal (success) after itineraries loaded
								const bookingReq = document.getElementById('booking-request-modal');
								if (bookingReq) bookingReq.style.display = 'flex';
							});
					} else {
						// Validation failed: ensure booking-request modal is hidden and show missing modal
						const bookingReq = document.getElementById('booking-request-modal');
						if (bookingReq) bookingReq.style.display = 'none';
						const missingContainer = document.getElementById('missing-container');
						if (missingContainer) missingContainer.style.display = 'flex';
					}
				});
			}
		});
	</script>
</body>
</html>
